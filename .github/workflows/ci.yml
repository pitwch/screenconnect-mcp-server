name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke (read mode tool list)
        env:
          SCREENCONNECT_BASE_URL: https://example.invalid
          SCREENCONNECT_API_SECRET: test-secret-not-real
          SCREENCONNECT_MODE: read
        run: npm run smoke
