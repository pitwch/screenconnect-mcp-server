name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies and build .mcpb bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npm ci
          npm run build:mcpb
          MCPB_FILE="screenconnect-mcp-server-${TAG}.mcpb"
          test -f "$MCPB_FILE"
          echo "mcpb_file=$MCPB_FILE" >> "$GITHUB_OUTPUT"
        id: mcpb

      - name: Extract CHANGELOG section for this tag
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "$" {grab=1; print; next}
            grab && $0 ~ /^## / {exit}
            grab {print}
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "## ${TAG}" > "$NOTES_FILE"
            echo >> "$NOTES_FILE"
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." >> "$NOTES_FILE"
          fi
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.changelog.outputs.notes_file }}
          MCPB_FILE: ${{ steps.mcpb.outputs.mcpb_file }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$MCPB_FILE" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --verify-tag
