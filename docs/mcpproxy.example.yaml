# Example mcpproxy upstream entry — stdio (recommended default) or Streamable HTTP.
# Start with SCREENCONNECT_MODE=read before enabling write or destructive tools.

servers:
  - name: screenconnect
    command: npx
    args:
      - -y
      - screenconnect-mcp-server
    env:
      SCREENCONNECT_BASE_URL: https://your-instance.example.com
      SCREENCONNECT_API_SECRET: ${SCREENCONNECT_API_SECRET}
      SCREENCONNECT_MODE: read
      SCREENCONNECT_ENABLE_COMMANDS: "false"
      # Full session-group paths only (leave empty if your instance omits group fields)
      SCREENCONNECT_ALLOWED_GROUPS: ""
    # Prefer mcpproxy read_only_only until write/destructive is approved
    # read_only_only: true

# Optional: Streamable HTTP upstream (single-tenant Docker / remote server)
#
# servers:
#   - name: screenconnect
#     url: http://127.0.0.1:8080/mcp
#     headers:
#       Authorization: Bearer ${MCP_HTTP_BEARER_TOKEN}

