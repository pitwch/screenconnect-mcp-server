  <path d="M210 352 h92" stroke="url(#scGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M192 388 h128" stroke="url(#scGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Connection node -->
